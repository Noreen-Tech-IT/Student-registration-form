<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="registrationform">
    <h1>Student Registration</h1>
    <form>
        <label>Name:</label>
        <input type="text" class="value">
        <br><br>
        <label>Father Name:</label>
        <input type="text" class="value">
        <br><br>
        <label>Email:</label>
        <input type="email" class="value">
        <br><br>
        <label>Password:</label>
        <input type="password" class="value">
        <br><br>
        <label>Age:</label>
        <input type="number" class="value">
        <br><br>
        <label>Gender:</label>
        <input type="radio" name="gender" class="value">Male
        <input type="radio" name="gender" class="value">Female
        <br><br>
        <label>City:</label>
        <select class="value">
            <option>Sargodha</option>
            <option>Lahore</option>
            <option>Islamabad</option>
            <option>Faisalabad</option>
            <option>Multan</option>
            <option>Sailkot</option>
            <option>Murree</option>
            <option>Karachi</option>
            <option>Bhkar</option>
        </select>
        <br><br>
       <label>Department:</label>
        <select class="value">
            <option>CS</option>
            <option>English</option>
            <option>Health and physical Education</option>
            <option>IT</option>
            <option>Mathmatics</option>
        </select>
        <br><br>
        <label>Skills:</label><br>
        <input type="checkbox" name="skill" class="value">Coding<br>
        <input type="checkbox" name="skill" class="value">Gaming<br>
        <input type="checkbox" name="skill" class="value">Cooking<br>
        <input type="checkbox" name="skill" class="value">Baking<br>
        <br><br>
        <label>Your Feedback:</label><br>
        <textarea class="value"></textarea>
        <br><br>
        <button>Submit!</button>
    </form>
    </div>
    
</body>
</html>
